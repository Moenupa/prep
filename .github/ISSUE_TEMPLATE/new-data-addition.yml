name: "🌟 New dataset support"
description: Request support for a new dataset or formatter pipeline
labels: ["dataset"]

body:
  - type: markdown
    attributes:
      value: |
        Support for a new dataset, that cannot be covered cleanly by the generic `vqa` pipeline and should be added as a formatter.

  - type: input
    id: dataset-name
    attributes:
      label: Dataset name
      description: Provide the canonical dataset name.
      placeholder: ...
    validations:
      required: true

  - type: dropdown
    id: desired-formats
    attributes:
      label: Desired output format
      description: Which outputs should prep support for this dataset first?
      multiple: true
      options:
        - sft
        - verl
        - eval
    validations:
      required: true

  - type: textarea
    id: loading-details
    attributes:
      label: Loading details
      description: Describe how the source can be loaded.
      placeholder: |
        - Source & Format: file / Hugging Face repo / ...
        - Splits: ...

  - type: textarea
    id: schema-details
    attributes:
      label: Schema details
      description: Share one or two representative records and any special handling needed.
      placeholder: |
        ```
        ...
        ```
